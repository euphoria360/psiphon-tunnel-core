name: Builds

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC to check for upstream updates
  workflow_dispatch: # Allows you to manually trigger the compilation at any time via the UI

jobs:
  sync:
    name: Sync Upstream Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: shirokhorshid
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: shirokhorshid
          upstream_sync_repo: shirokhorshid/psiphon-tunnel-core
          test_mode: false

  build:
    name: Build Binaries
    needs: sync
    # Run if upstream had changes OR if you triggered it manually
    if: ${{ needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux Targets
          - goos: linux
            goarch: amd64
            archive_name: psiphon-tunnel-core-linux-amd64.tar.gz
            binary_output: psiphon-tunnel-core
          - goos: linux
            goarch: 386
            archive_name: psiphon-tunnel-core-linux-386.tar.gz
            binary_output: psiphon-tunnel-core
          - goos: linux
            goarch: arm
            goarm: 7
            archive_name: psiphon-tunnel-core-linux-armv7.tar.gz
            binary_output: psiphon-tunnel-core
          - goos: linux
            goarch: arm64
            archive_name: psiphon-tunnel-core-linux-arm64.tar.gz
            binary_output: psiphon-tunnel-core
          - goos: linux
            goarch: mipsle
            archive_name: psiphon-tunnel-core-linux-mipsle.tar.gz
            binary_output: psiphon-tunnel-core

          # Windows Targets
          - goos: windows
            goarch: amd64
            archive_name: psiphon-tunnel-core-windows-amd64.zip
            binary_output: psiphon-tunnel-core.exe
          - goos: windows
            goarch: 386
            archive_name: psiphon-tunnel-core-windows-386.zip
            binary_output: psiphon-tunnel-core.exe

          # macOS Targets
          - goos: darwin
            goarch: amd64
            archive_name: psiphon-tunnel-core-darwin-amd64.tar.gz
            binary_output: psiphon-tunnel-core
          - goos: darwin
            goarch: arm64
            archive_name: psiphon-tunnel-core-darwin-arm64.tar.gz
            binary_output: psiphon-tunnel-core

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build and Compress Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          # Create a clean work directory for archiving
          mkdir -p staging builds
          
          # Navigate to core source directory and build
          cd ConsoleClient
          go build -v -ldflags="-s -w" -o ../staging/${{ matrix.binary_output }} .
          cd ..
          
          # Compress based on file extension matrix configurations
          if [[ "${{ matrix.archive_name }}" == *.tar.gz ]]; then
            tar -czvf "builds/${{ matrix.archive_name }}" -C staging ${{ matrix.binary_output }}
          elif [[ "${{ matrix.archive_name }}" == *.zip ]]; then
            cd staging && zip "../builds/${{ matrix.archive_name }}" ${{ matrix.binary_output }} && cd ..
          fi

      - name: Upload Artifacts Intermediary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: builds/${{ matrix.archive_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds/

      - name: Consolidate Binaries
        run: |
          mkdir final-release
          find all-builds/ -type f -exec cp {} final-release/ \;
          ls -la final-release/

      - name: Generate Tag Version
        id: tag
        run: echo "release_tag=build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Publish Automated Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body: |
            Automated multi-architecture compilation for psiphon-tunnel-core.
            All binaries are packed and compressed (.tar.gz for Linux/macOS, .zip for Windows).
            Synced automatically from original repository.
          draft: false
          prerelease: false
          files: final-release/*
